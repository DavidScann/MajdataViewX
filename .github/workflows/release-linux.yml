# Auto-release: when a PR is merged/rebased onto linux-port, build the
# MajdataX Linux x86_64 bundle, tag the commit, and publish a GitHub release.
#
# Required secrets:
#   UNITY_LICENSE   - contents of your Unity .ulf license file
#   UNITY_EMAIL     - Unity ID email
#   UNITY_PASSWORD  - Unity ID password
#   GH_TOKEN        - optional; falls back to the default GITHUB_TOKEN for `gh release create`
#
# Note: GITHUB_TOKEN alone works for releases created by `gh release create`
# because the workflow's permissions.request is set to `contents: write`.

name: Release Linux Build

on:
  pull_request:
    types: [closed]
    branches: [linux-port]
  push:
    branches: [linux-port]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version tag (e.g. v6.0.0-linux.3). Leave empty to auto-increment.'
        required: false
        default: ''

concurrency:
  group: release-linux
  cancel-in-progress: false

permissions:
  contents: write   # needed for `git push` of the tag and `gh release create`
  pull-requests: read

jobs:
  release:
    # Only run when:
    #   - workflow_dispatch (manual trigger), OR
    #   - push to linux-port, OR
    #   - PR closed AND merged
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90   # Unity build + dotnet + zip can take ~15 min cold
    env:
      UNITY_VERSION: 6000.3.17f1
      DOTNET_VERSION: 10.0.x
      VERSION_BASE: v6.0.0-linux

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Checkout MajdataViewX
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0   # need full history for tag auto-increment

      - name: Checkout MajdataEdit-Neo (sister repo)
        # actions/checkout refuses to clone outside $GITHUB_WORKSPACE, so we
        # do it manually with the workflow's GITHUB_TOKEN.
        run: |
          cd "$RUNNER_TEMP"
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/DavidScann/MajdataEdit-Neo-Linux.git" \
            MajdataEdit-Neo-Linux
          cd MajdataEdit-Neo-Linux
          git log -1 --oneline

      - name: Install .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Unity cache
        uses: actions/cache@v4
        with:
          path: |
            Library
            ${{ runner.temp }}/MajdataEdit-Neo-Linux/bin
            ${{ runner.temp }}/MajdataEdit-Neo-Linux/obj
          key: lib-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            lib-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build Unity Linux player
        uses: game-ci/unity-builder@v4.2.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: MajdataView
          buildScript: BuildScript.Build
          customParameters: -Il2CppConfig release

      - name: Verify Unity build output
        run: |
          ls -la build/Linux/MajdataView.x86_64 build/Linux/GameAssembly.so
          file build/Linux/MajdataView.x86_64

      - name: Determine next version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            LATEST=$(git tag --list "${VERSION_BASE}.*" --sort=-version:refname | head -n 1)
            if [[ -z "$LATEST" ]]; then
              VERSION="${VERSION_BASE}.1"
            else
              NUM="${LATEST#${VERSION_BASE}.}"
              if [[ "$NUM" =~ ^[0-9]+$ ]]; then
                VERSION="${VERSION_BASE}.$((NUM + 1))"
              else
                VERSION="${VERSION_BASE}.1"
              fi
            fi
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION}"

      - name: Build MajdataEdit-Neo (.NET)
        working-directory: ${{ runner.temp }}/MajdataEdit-Neo-Linux
        run: |
          dotnet publish MajdataEdit-Neo.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o "$GITHUB_WORKSPACE/dist/editor-publish"

      - name: Assemble bundle
        run: |
          set -e
          BUNDLE_NAME="MajdataX-Linux-${VERSION}"
          BUNDLE_DIR="dist/${BUNDLE_NAME}"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          # Unity player output
          cp -a build/Linux/. "$BUNDLE_DIR/"
          # .NET editor (skip duplicate runtimeconfig)
          rsync -a --exclude='*.pdb' --exclude='*.runtimeconfig.json' \
            dist/editor-publish/ "$BUNDLE_DIR/"
          # Drop Unity build-only artifacts
          rm -rf "$BUNDLE_DIR/MajdataView_BackUpThisFolder_ButDontShipItWithYourGame"
          rm -rf "$BUNDLE_DIR/MajdataView_BurstDebugInformation_DoNotShip"
          # Sanity check
          test -f "$BUNDLE_DIR/MajdataView.x86_64" || (echo "ERROR: player missing" && exit 1)
          test -x "$BUNDLE_DIR/MajdataEdit-Neo"     || (echo "ERROR: editor missing" && exit 1)
          test -f "$BUNDLE_DIR/MajdataView_Data/Plugins/AnyCPU/libbassopus.so" \
            || echo "WARNING: libbassopus.so not bundled — Opus audio will not work"
          echo "Bundle assembled: $BUNDLE_DIR"
          du -sh "$BUNDLE_DIR"

      - name: Create zip
        run: |
          cd dist
          rm -f "MajdataX-Linux-${VERSION}.zip"
          zip -r9 -q "MajdataX-Linux-${VERSION}.zip" "MajdataX-Linux-${VERSION}" \
            -x "MajdataX-Linux-${VERSION}/.autosave/*"
          ls -la "MajdataX-Linux-${VERSION}.zip"
          echo "ZIP_PATH=dist/MajdataX-Linux-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "BUNDLE_NAME=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Linux port ${{ steps.version.outputs.tag }}
          Auto-released by .github/workflows/release-linux.yml
          Commit: ${{ github.sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'NOTES_EOF'
          ## MajdataEdit-Neo + MajdataView — Linux x86_64

          Tag: `${{ steps.version.outputs.tag }}`
          Commit: `${GITHUB_SHA:0:7}`
          Workflow run: ${{ github.run_id }}

          Built automatically by `release-linux.yml`.

          ### Run
          ```bash
          unzip MajdataX-Linux-${{ steps.version.outputs.tag }}.zip
          cd MajdataX-Linux-${{ steps.version.outputs.tag }}
          ./MajdataEdit-Neo
          ```

          ### Requirements
          - `ffmpeg` in `$PATH` (for video preview)
          - `libopus` (system)
          - X11 or Wayland
          NOTES_EOF
          )
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MajdataEdit-Neo ${{ steps.version.outputs.tag }} — Linux" \
            --notes "$NOTES" \
            "dist/MajdataX-Linux-${{ steps.version.outputs.tag }}.zip#MajdataX-Linux-${{ steps.version.outputs.tag }}.zip"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MajdataX-Linux-${{ steps.version.outputs.tag }}
          path: dist/MajdataX-Linux-${{ steps.version.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 14
