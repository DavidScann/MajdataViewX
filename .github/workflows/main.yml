name: Build Project
run-name: Build ${{ matrix.target }}
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [StandaloneWindows, StandaloneLinux64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.target }}
          restore-keys: Library-${{ matrix.target }}
      - uses: game-ci/unity-builder@v4.2.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          versioning: Semantic
          buildName: MajdataView
      - run: ls -R
      - uses: actions/upload-artifact@v3
        with:
          name: Build-${{ matrix.target }}
          path: build
